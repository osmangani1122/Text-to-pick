<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাতের লেখা টুলস - osmangani.pro.bd</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600&family=Baloo+Da+2:wght@400;600&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* আপনার আপলোড করা ফাইল অনুযায়ী ফন্ট সেটআপ */
        @font-face {
            font-family: 'DefaultBangla';
            src: url('bangla/default.ttf');
        }
        @font-face {
            font-family: 'DefaultEnglish';
            src: url('english/default.ttf');
        }

        :root {
            --primary-bg: #f8fafc;
            --panel-bg: #ffffff;
            --accent-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hind Siliguri', sans-serif; background: var(--primary-bg); color: #333; }

        header { background: #1e293b; color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { font-family: 'Baloo Da 2', cursive; font-size: 1.8rem; }

        .container { max-width: 1100px; margin: 20px auto; display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 0 15px; }

        /* সেটিংস প্যানেল */
        .sidebar { background: var(--panel-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); height: fit-content; }
        .control-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        
        textarea { 
            width: 100%; height: 110px; padding: 12px; border: 1.5px solid #e2e8f0; 
            border-radius: 10px; resize: none; font-size: 1rem; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--accent-color); }

        .row { display: flex; gap: 12px; margin-bottom: 10px; }
        .row div { flex: 1; }
        select { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 10px; background: #fff; cursor: pointer; outline: none; }

        /* কালার ইনপুট ডিজাইন */
        input[type="color"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 42px; background-color: transparent;
            border: 1.5px solid #e2e8f0; border-radius: 10px; cursor: pointer; padding: 4px;
        }
        input[type="color"]::-webkit-color-swatch { border-radius: 6px; border: none; }

        /* প্রিভিউ এরিয়া মোবাইল ফিক্স */
        .preview-area { background: #cbd5e1; padding: 25px 15px; border-radius: 15px; overflow: hidden; width: 100%; }
        #paper-wrapper { 
            width: 100%; overflow-x: auto; display: flex; 
            justify-content: flex-start; -webkit-overflow-scrolling: touch; padding-bottom: 15px;
        }

        #paper {
            flex-shrink: 0; width: 650px; min-height: 800px;
            background-color: #fff; padding: 50px 40px 50px 75px;
            position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin: 0 auto;
        }

        .ruled-style {
            background-image: linear-gradient(#c8d8e8 1px, transparent 1px);
            background-size: 100% 35px;
        }
        .ruled-style::before {
            content: ''; position: absolute; left: 65px; top: 0; bottom: 0;
            width: 1.5px; background: #ffadad;
        }

        /* প্রিভিউ টেক্সট ধরা যাবে না */
        #paper-content {
            white-space: pre-wrap; word-wrap: break-word; outline: none;
            color: #1a237e; font-size: 22px; line-height: 35px;
            user-select: none; pointer-events: none;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn { padding: 12px 5px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.3s; text-align: center; }
        .btn-png { background: #10b981; }
        .btn-jpg { background: #f59e0b; }
        .btn-pdf { background: #ef4444; }
        .btn:hover { opacity: 0.85; transform: translateY(-2px); }

        /* ডেভেলপার সেকশন */
        footer { background: #fff; padding: 40px 15px; margin-top: 40px; border-top: 1px solid #e2e8f0; text-align: center; }
        .dev-info h2 { font-size: 1.4rem; margin-bottom: 25px; color: #1e293b; }
        .dev-pic { 
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover; 
            border: 4px solid var(--accent-color); margin: 0 auto 15px; display: block; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #eee;
        }
        .dev-name { font-size: 1.3rem; font-weight: bold; color: #1e293b; display: block; }
        .dev-vibe { font-size: 0.85rem; color: #64748b; font-weight: 500; display: block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .fb-icon { font-size: 2.2rem; color: #1877f2; text-decoration: none; display: inline-block; }
        .fb-icon:hover { transform: scale(1.2); }
        .copyright { margin-top: 30px; font-size: 0.85rem; color: #94a3b8; }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
            header { padding: 15px; }
            .preview-area { border-radius: 0; padding: 15px 5px; }
        }
    </style>
</head>
<body>

<header>
    <h1>✍️ হাতের লেখা টুলস</h1>
</header>

<div class="container">
    <div class="sidebar">
        <div class="control-group">
            <label>আপনার টেক্সট লিখুন</label>
            <textarea id="textInput" placeholder="আমাদের বাংলাদেশ🇧🇩&#10;Our Bangladesh🇧🇩"></textarea>
        </div>

        <div class="control-group">
            <label>ফন্ট সিলেক্ট করুন</label>
            <div class="row">
                <div>
                    <label style="font-size: 0.7rem; color:#888;">English</label>
                    <select id="engFont">
                        <!-- Default English Font (english/default.ttf) -->
                        <option value="'DefaultEnglish'" selected>হাতে লেখা (Default)</option>
                        <option value="'Caveat'">Handwriting 1 (Google)</option>
                        <option value="cursive">Classic Cursive</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.7rem; color:#888;">বাংলা</label>
                    <select id="bnFont">
                        <!-- Default Bangla Font (bangla/default.ttf) -->
                        <option value="'DefaultBangla'" selected>হাতে লেখা (Default)</option>
                        <option value="'Baloo Da 2'">Baloo Da</option>
                        <option value="'Hind Siliguri'">Hind Siliguri</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>কাগজের ধরন</label>
            <select id="paperType">
                <option value="ruled">খাতা (দাগ কাটা)</option>
                <option value="plain">সাদা কাগজ</option>
                <option value="yellow">হলুদ কাগজ</option>
                <option value="diary">ডায়েরি</option>
            </select>
        </div>

        <div class="control-group">
            <label>খাতা ও কালির রং</label>
            <div class="row">
                <div>
                    <label style="font-size: 0.7rem; color:#888;">কাগজ</label>
                    <input type="color" id="paperColor" value="#ffffff">
                </div>
                <div>
                    <label style="font-size: 0.7rem; color:#888;">কালি</label>
                    <input type="color" id="inkColor" value="#1a237e">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>ফন্ট সাইজ: <span id="fs-label">22</span>px</label>
            <input type="range" id="fontSize" min="15" max="40" value="22">
        </div>

        <div class="control-group">
            <label>লাইনের দূরত্ব: <span id="lh-label">35</span>px</label>
            <input type="range" id="lineHeight" min="25" max="60" value="35">
        </div>

        <div class="btn-group">
            <button class="btn btn-png" onclick="download('png')">PNG</button>
            <button class="btn btn-jpg" onclick="download('jpg')">JPG</button>
            <button class="btn btn-pdf" onclick="download('pdf')">PDF</button>
        </div>
    </div>

    <div class="preview-area">
        <div id="paper-wrapper">
            <div id="paper" class="ruled-style">
                <div id="paper-content"></div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="dev-info">
        <h2>Developer Info</h2>
        <img src="developer.jpg" alt="Md Osman Gani" class="dev-pic">
        <span class="dev-name">Md Osman Gani</span>
        <span class="dev-vibe">vibe cooder</span>
        <a href="https://www.facebook.com/fahhh.t1xn" target="_blank" class="fb-icon">
            <i class="fab fa-facebook"></i>
        </a>
        <p class="copyright">© 2026 osmangani.pro.bd All Rights Reserved.</p>
    </div>
</footer>

<script>
    const textInput = document.getElementById('textInput');
    const paperContent = document.getElementById('paper-content');
    const paper = document.getElementById('paper');
    const engFont = document.getElementById('engFont');
    const bnFont = document.getElementById('bnFont');
    const paperType = document.getElementById('paperType');
    const paperColor = document.getElementById('paperColor');
    const inkColor = document.getElementById('inkColor');
    const fontSize = document.getElementById('fontSize');
    const lineHeight = document.getElementById('lineHeight');

    function updatePaper() {
        let val = textInput.value;
        if (val === "") {
            val = "আমাদের বাংলাদেশ🇧🇩\nOur Bangladesh🇧🇩";
        }
        paperContent.innerText = val;

        paperContent.style.fontFamily = `${engFont.value}, ${bnFont.value}, sans-serif`;
        paper.style.backgroundColor = paperColor.value;
        paperContent.style.color = inkColor.value;
        paperContent.style.fontSize = fontSize.value + 'px';
        paperContent.style.lineHeight = lineHeight.value + 'px';
        document.getElementById('fs-label').innerText = fontSize.value;
        document.getElementById('lh-label').innerText = lineHeight.value;

        paper.className = ''; 
        if (paperType.value === 'ruled' || paperType.value === 'diary') {
            paper.classList.add('ruled-style');
            paper.style.backgroundSize = `100% ${lineHeight.value}px`;
        }
        if (paperType.value === 'yellow') paper.style.backgroundColor = "#fff9c4";
        if (paperType.value === 'diary') paper.style.borderLeft = "20px solid #5d4037";
        else paper.style.borderLeft = "none";
    }

    [textInput, engFont, bnFont, paperType, paperColor, inkColor, fontSize, lineHeight].forEach(el => {
        el.addEventListener('input', updatePaper);
    });

    async function download(format) {
        const canvas = await html2canvas(paper, { scale: 2, useCORS: true });
        const link = document.createElement('a');
        if (format === 'png') {
            link.download = 'handwriting.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } else if (format === 'jpg') {
            link.download = 'handwriting.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        } else if (format === 'pdf') {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = (canvas.height * pdfW) / canvas.width;
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
            pdf.save('handwriting.pdf');
        }
    }
    updatePaper();
</script>

</body>
</html>
